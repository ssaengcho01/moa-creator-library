name: Collect and publish Design Shelf
on:
  schedule:
    - cron: '15 0 * * *' # 09:15 Asia/Seoul, scheduling can be delayed by GitHub
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'storage/**', 'public/thumbnails/**', 'README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: design-shelf-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parsers and merge rules
        run: npm test
      - name: Collect public listings
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect.cjs
      - name: Check missing thumbnails
        id: thumbs
        run: node scripts/check-thumbnails.cjs
      - name: Install screenshot browser when needed
        if: steps.thumbs.outputs.needed == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false playwright && npx playwright install --with-deps chromium
      - name: Capture actual pages without images
        if: steps.thumbs.outputs.needed == 'true'
        continue-on-error: true
        run: node scripts/capture-missing.cjs
      - name: Save collection data and error status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/library.json storage/index.json storage/source-pool.json storage/discovery-log.json storage/media.json public/thumbnails
          if ! git diff --staged --quiet; then
            git commit -m 'Update public resource index'
            git push
          fi
      - name: Version browser assets
        run: node scripts/version-assets.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag crawl errors after publishing preserved data
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'One or more sources failed. Previous resources were preserved; inspect source status in the app.'
          exit 1
